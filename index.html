<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sistem Absensi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">
  <aside class="side" id="sidebar"></aside>
  <div class="main">
    <header class="nav">
      <button class="btn" id="menuBtn" aria-label="Menu"><i class="fa fa-bars"></i></button>
      <h1>Dashboard</h1>
      <span><i class="fa fa-user-circle"></i></span>
    </header>
    <section class="wrap">
      <div class="card hero">
        <div class="hero-top">
          <div>
            <small>Selamat datang,</small>
            <h2 id="uName">-</h2>
            <div class="muted" id="uEmail"></div>
            <span class="pill" id="uStatus"></span>
          </div>
          <div class="clock"><b id="clock">--:--:--</b><small id="dateLong"></small></div>
        </div>
      </div>
      <div class="card today" id="todayCard"><h3>Absensi Hari Ini</h3><p class="muted">Memuat...</p></div>
      <div class="cards" id="stats"></div>
      <div id="legacy" hidden>
        <h3>Ringkasan Data Kelas</h3>
        <div class="cards" id="cards"></div>
      </div>
    </section>
  </div>
  <div id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
