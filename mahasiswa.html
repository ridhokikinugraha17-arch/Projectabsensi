<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Mahasiswa - Sistem Absensi Mahasiswa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="mahasiswa">
  <aside class="side" id="sidebar"></aside>
  <div class="main">
    <header class="nav">
      <button class="btn" id="menuBtn"><i class="fa fa-bars"></i></button>
      <h1>Data Mahasiswa</h1>
      <span><i class="fa fa-user-circle"></i> Admin</span>
    </header>
    <section class="wrap">
      <div class="card">
        <h3 id="formTitle">Tambah Mahasiswa</h3>
        <form id="form" class="grid">
          <div><label>NPM</label><input id="npm" required></div>
          <div><label>Nama</label><input id="nama" required></div>
          <div><label>Kelas</label><input id="kelas" placeholder="contoh: TI-1A" required></div>
          <div><label>Program Studi</label><input id="prodi" required></div>
          <div><br><button class="btn"><i class="fa fa-save"></i> Simpan</button> <button type="button" class="btn r" id="batal" hidden><i class="fa fa-xmark"></i> Batal</button></div>
        </form>
      </div>
      <div class="card">
        <input id="cari" placeholder="Cari NPM, nama, kelas, prodi...">
        <div class="tw"><table><thead><tr><th>No</th><th>NPM</th><th>Nama</th><th>Kelas</th><th>Program Studi</th><th>Aksi</th></tr></thead><tbody id="tbody"></tbody></table></div>
      </div>
    </section>
  </div>
  <div id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
