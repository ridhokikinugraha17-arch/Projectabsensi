<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Saya - Sistem Absensi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="history">
  <aside class="side" id="sidebar"></aside>
  <div class="main">
    <header class="nav">
      <button class="btn" id="menuBtn" aria-label="Menu"><i class="fa fa-bars"></i></button>
      <h1>Riwayat Absensi</h1>
      <span><i class="fa fa-user-circle"></i></span>
    </header>
    <section class="wrap">
      <div class="card">
        <div class="grid">
          <div><label for="cari">Pencarian</label><input id="cari" placeholder="Cari tanggal / status..." style="margin:0"></div>
          <div><label for="fTanggal">Tanggal</label><input type="date" id="fTanggal"></div>
          <div><label for="fStatus">Status</label><select id="fStatus"><option value="">Semua</option><option>Hadir</option><option>Terlambat</option></select></div>
        </div>
      </div>
      <div class="card">
        <div class="tw"><table class="rt"><thead><tr><th>Tanggal</th><th>Waktu</th><th>Status</th><th>Jarak</th><th>Lokasi</th></tr></thead><tbody id="tbody"></tbody></table></div>
        <div class="pager">
          <span class="muted" id="info"></span>
          <span class="row"><button class="btn o s" id="prev"><i class="fa fa-chevron-left"></i> Sebelumnya</button><button class="btn o s" id="next">Berikutnya <i class="fa fa-chevron-right"></i></button></span>
        </div>
      </div>
    </section>
  </div>
  <div id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/history.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
