<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - Sistem Absensi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
  <main class="login">
    <form class="card" id="regForm" novalidate>
      <div class="brand"><i class="fa fa-fingerprint"></i><div>Sistem Absensi</div></div>
      <p class="sub">Buat akun baru untuk mulai absensi.</p>
      <div><label for="nama">Nama lengkap</label><input id="nama" autocomplete="name" required></div>
      <div><label for="email">Email</label><input type="email" id="email" autocomplete="username" inputmode="email" required></div>
      <div>
        <label for="password">Password</label>
        <div class="pw">
          <input type="password" id="password" autocomplete="new-password" minlength="6" required>
          <button type="button" data-toggle-pw="password" aria-label="Tampilkan password"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <div>
        <label for="konfirmasi">Konfirmasi password</label>
        <div class="pw">
          <input type="password" id="konfirmasi" autocomplete="new-password" required>
          <button type="button" data-toggle-pw="konfirmasi" aria-label="Tampilkan password"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <div class="msg" id="msg" role="alert"></div>
      <button class="btn" id="daftar"><i class="fa fa-user-plus"></i> Daftar</button>
      <div class="alt">Sudah punya akun? <a href="login.html">Login</a></div>
    </form>
  </main>
  <div id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
