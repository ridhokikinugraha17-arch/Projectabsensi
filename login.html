<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Sistem Absensi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <main class="login">
    <form class="card" id="loginForm" novalidate>
      <div class="brand"><i class="fa fa-fingerprint"></i><div>Sistem Absensi</div></div>
      <p class="sub">Masuk untuk melakukan absensi dan melihat riwayat Anda.</p>
      <div><label for="email">Email</label><input type="email" id="email" autocomplete="username" inputmode="email" placeholder="nama@email.com" required></div>
      <div>
        <label for="password">Password</label>
        <div class="pw">
          <input type="password" id="password" autocomplete="current-password" required>
          <button type="button" data-toggle-pw="password" aria-label="Tampilkan password"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <div class="msg" id="msg" role="alert"></div>
      <button class="btn" id="masuk"><i class="fa fa-right-to-bracket"></i> Login</button>
      <div class="alt">Belum punya akun? <a href="register.html">Daftar</a><br><a href="admin-login.html"><i class="fa fa-user-shield"></i> Login sebagai Admin</a></div>
    </form>
  </main>
  <div id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
