<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Sistem Absensi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-login">
  <main class="login">
    <form class="card" id="loginForm" novalidate>
      <div class="brand"><i class="fa fa-user-shield"></i><div>Sistem Absensi<br><span class="badge b-admin">Admin</span></div></div>
      <p class="sub">Halaman khusus administrator. Akun biasa tidak dapat masuk dari sini.</p>
      <div><label for="email">Email admin</label><input type="email" id="email" autocomplete="username" inputmode="email" required></div>
      <div>
        <label for="password">Password</label>
        <div class="pw">
          <input type="password" id="password" autocomplete="current-password" required>
          <button type="button" data-toggle-pw="password" aria-label="Tampilkan password"><i class="fa fa-eye"></i></button>
        </div>
      </div>
      <div class="msg" id="msg" role="alert"></div>
      <button class="btn" id="masuk"><i class="fa fa-right-to-bracket"></i> Login Admin</button>
      <div class="alt"><a href="login.html"><i class="fa fa-arrow-left"></i> Kembali ke login pengguna</a></div>
    </form>
  </main>
  <div id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
